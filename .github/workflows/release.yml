name: Release

# Push a `v*` tag to cut a release: test, package, create the GitHub Release
# with the tarball attached, then publish the same version to npm.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match `version` in package.json; a mismatch fails the run
# before anything is published.
#
# Publishing uses the NPM_TOKEN repository secret (a granular npm "Publish"
# token). npm is retiring 2FA-bypass tokens for direct publishing, so the
# long-term setup is Trusted Publishing:
#   1. enable full 2FA on the npm account (email OTP is not enough — the
#      trust API answers 403 "Please enable 2fa for your account");
#   2. on npmjs.com open the package's Settings -> Trusted Publisher, add
#      repository Diomchen/dsh-better-tag and workflow release.yml, and
#      allow "npm publish";
#   3. delete the NPM_TOKEN secret.
# docs/RELEASING.md walks through the same steps.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 ships npm 11.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          VERSION="$(npm --version)"
          echo "npm $VERSION"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; }; then
            echo "npm $VERSION is too old for trusted publishing (needs 11.5.1+)"
            exit 1
          fi

      - name: Verify tag matches package version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const pkg = JSON.parse(readFileSync("package.json", "utf8"))
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (tag !== pkg.version) {
              console.error(`tag v${tag} does not match package version ${pkg.version}`)
              process.exit(1)
            }
            console.log(`releasing ${pkg.name}@${pkg.version}`)
          '

      - name: Host tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Pack tarball
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-better-tag@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-better-tag@$VERSION is already on npm — nothing to publish"
          else
            npm publish --ignore-scripts --provenance --access public
          fi
