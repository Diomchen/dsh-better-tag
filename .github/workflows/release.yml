name: Release

# Push a `v*` tag to cut a release: test, package, create the GitHub Release
# with the tarball attached, then publish the same version to npm.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match `version` in package.json; a mismatch fails the run
# before anything is published.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const pkg = JSON.parse(readFileSync("package.json", "utf8"))
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (tag !== pkg.version) {
              console.error(`tag v${tag} does not match package version ${pkg.version}`)
              process.exit(1)
            }
            console.log(`releasing ${pkg.name}@${pkg.version}`)
          '

      - name: Host tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Pack tarball
        run: npm pack --ignore-scripts --pack-destination dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance --access public
