<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Flat tags on session rows, a done stamp, and the cross-workspace overview">
  <rect width="640" height="300" rx="20" fill="#f3f5f9"/>

  <!-- session list -->
  <rect x="32" y="32" width="352" height="236" rx="16" fill="#ffffff" stroke="#d7dfea" stroke-width="2"/>
  <rect x="56" y="48" width="96" height="8" rx="4" fill="#c9d3e0"/>

  <!-- row 1: pending, two tags, +1 -->
  <circle cx="58" cy="88" r="7" fill="#f0a35e"/>
  <rect x="76" y="82" width="132" height="10" rx="5" fill="#d9e1eb"/>
  <rect x="176" y="78" width="46" height="20" rx="6" fill="#e7edfb" stroke="#9db4f5" stroke-width="1.5"/>
  <rect x="230" y="78" width="42" height="20" rx="6" fill="#f5e9fd" stroke="#cfa0ec" stroke-width="1.5"/>
  <rect x="280" y="84" width="18" height="8" rx="4" fill="#c9d3e0"/>

  <!-- row 2: handed back, one tag, done stamp -->
  <circle cx="58" cy="132" r="7" fill="#67c98a"/>
  <rect x="76" y="126" width="108" height="10" rx="5" fill="#d9e1eb"/>
  <rect x="214" y="122" width="50" height="20" rx="6" fill="#fdf0e3" stroke="#efb37c" stroke-width="1.5"/>
  <circle cx="334" cy="132" r="12" fill="#e8f7ee" stroke="#79cf99" stroke-width="1.5"/>
  <path d="M328.5 132.3 332.4 136 339.8 128.6" fill="none" stroke="#4aa86c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- row 3: running, one tag -->
  <circle cx="58" cy="176" r="7" fill="#7c9cff"/>
  <rect x="76" y="170" width="150" height="10" rx="5" fill="#d9e1eb"/>
  <rect x="244" y="166" width="46" height="20" rx="6" fill="#e8f1fe" stroke="#8fb0f6" stroke-width="1.5"/>

  <!-- row 4: idle, tag plus temp tag -->
  <circle cx="58" cy="220" r="7" fill="#9aa0ad"/>
  <rect x="76" y="214" width="118" height="10" rx="5" fill="#d9e1eb"/>
  <rect x="206" y="210" width="40" height="20" rx="6" fill="#eef4ec" stroke="#98c88c" stroke-width="1.5"/>
  <rect x="252" y="210" width="44" height="20" rx="6" fill="none" stroke="#b9c4d3" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- overview -->
  <rect x="408" y="44" width="200" height="212" rx="16" fill="#ffffff" stroke="#d7dfea" stroke-width="2"/>
  <rect x="428" y="64" width="76" height="9" rx="4.5" fill="#c9d3e0"/>
  <rect x="428" y="86" width="26" height="9" rx="4.5" fill="#f4d8b9"/>
  <rect x="460" y="86" width="26" height="9" rx="4.5" fill="#c9ecd5"/>
  <rect x="492" y="86" width="26" height="9" rx="4.5" fill="#d4dffb"/>
  <rect x="524" y="86" width="26" height="9" rx="4.5" fill="#e5e8ee"/>

  <!-- filter pills -->
  <rect x="428" y="108" width="44" height="18" rx="9" fill="#1f232b"/>
  <rect x="478" y="108" width="36" height="18" rx="9" fill="#efe5fb" stroke="#cfa0ec" stroke-width="1.2"/>
  <rect x="520" y="108" width="36" height="18" rx="9" fill="#e4eefc" stroke="#9db4f5" stroke-width="1.2"/>

  <!-- mini rows -->
  <circle cx="434" cy="150" r="5.5" fill="#f0a35e"/>
  <rect x="448" y="146" width="70" height="8" rx="4" fill="#d9e1eb"/>
  <rect x="534" y="143" width="30" height="14" rx="5" fill="#e7edfb" stroke="#9db4f5" stroke-width="1.2"/>

  <circle cx="434" cy="182" r="5.5" fill="#67c98a"/>
  <rect x="448" y="178" width="92" height="8" rx="4" fill="#d9e1eb"/>
  <rect x="552" y="175" width="30" height="14" rx="5" fill="#fdf0e3" stroke="#efb37c" stroke-width="1.2"/>

  <circle cx="434" cy="214" r="5.5" fill="#7c9cff"/>
  <rect x="448" y="210" width="60" height="8" rx="4" fill="#d9e1eb"/>
  <rect x="520" y="207" width="30" height="14" rx="5" fill="#e8f7ee" stroke="#98c88c" stroke-width="1.2"/>
</svg>
